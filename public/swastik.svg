<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="kumkumGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="45%" stop-color="#FF671F" />
      <stop offset="100%" stop-color="#CC2B00" />
    </linearGradient>
    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF671F" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Sacred Vedic Swastika Arms with rounded joints & ends -->
  <g fill="url(#kumkumGold)" filter="url(#divineGlow)">
    <!-- Central Vertical Bar -->
    <rect x="228" y="50" width="44" height="400" rx="10" />

    <!-- Central Horizontal Bar -->
    <rect x="50" y="228" width="400" height="44" rx="10" />

    <!-- Top-Right Clockwise Bent Arm -->
    <rect x="228" y="50" width="222" height="44" rx="10" />

    <!-- Bottom-Right Clockwise Bent Arm -->
    <rect x="406" y="228" width="44" height="222" rx="10" />

    <!-- Bottom-Left Clockwise Bent Arm -->
    <rect x="50" y="406" width="222" height="44" rx="10" />

    <!-- Top-Left Clockwise Bent Arm -->
    <rect x="50" y="50" width="44" height="222" rx="10" />

    <!-- 4 Sacred Auspicious Bindus (चतुर्बिंदु) -->
    <circle cx="145" cy="145" r="22" />
    <circle cx="355" cy="145" r="22" />
    <circle cx="355" cy="355" r="22" />
    <circle cx="145" cy="355" r="22" />
  </g>
</svg>
